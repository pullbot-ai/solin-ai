name: Train Parity Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Cache model
      uses: actions/cache@v4
      with:
        path: models
        key: ${{ runner.os }}-parity-model-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-parity-model-
    
    - name: Train parity model
      run: python workflows/train_parity.py
    
    - name: Upload model
      uses: actions/upload-artifact@v4
      with:
        name: parity-model
        path: models/parity_nlt.json
    
    - name: Upload stats
      uses: actions/upload-artifact@v4
      with:
        name: parity-stats
        path: models/parity_stats.json
    
    - name: Commit model
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add models/parity_nlt.json models/parity_stats.json models/parity_policy.npz
        git commit -m "Update parity model [skip ci]" || echo "No changes to commit"
        git push
