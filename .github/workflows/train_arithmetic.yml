name: Train Arithmetic Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Cache model
      uses: actions/cache@v4
      with:
        path: models
        key: ${{ runner.os }}-arithmetic-model-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-arithmetic-model-
    
    - name: Train arithmetic model
      run: python workflows/train_arithmetic.py
    
    - name: Upload model
      uses: actions/upload-artifact@v4
      with:
        name: arithmetic-model
        path: models/arithmetic_nlt.json
    
    - name: Upload stats
      uses: actions/upload-artifact@v4
      with:
        name: arithmetic-stats
        path: models/arithmetic_stats.json
    
    - name: Commit model
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add models/arithmetic_nlt.json models/arithmetic_stats.json models/arithmetic_policy.npz
        git commit -m "Update arithmetic model [skip ci]" || echo "No changes to commit"
        git push
